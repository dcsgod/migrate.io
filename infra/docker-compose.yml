version: "3.9"

# ─────────────────────────────────────────────────────────────
# Migrate.io — Final-Product Docker Compose
# Runs: Neo4j, FastAPI backend, Vite React frontend, MinIO (S3)
# ─────────────────────────────────────────────────────────────

services:

  # ── Neo4j (graph persistence) ────────────────────────────
  neo4j:
    image: neo4j:5.20-community
    container_name: migrate_io_neo4j
    environment:
      NEO4J_AUTH: neo4j/migrate_io_neo4j
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 2g
    ports:
      - "7474:7474"   # Browser UI
      - "7687:7687"   # Bolt
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "migrate_io_neo4j", "RETURN 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - migrate_net

  # ── MinIO (local S3-compatible object storage) ────────────
  minio:
    image: minio/minio:latest
    container_name: migrate_io_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console UI
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - migrate_net

  # ── MinIO bucket init ────────────────────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: migrate_io_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/migrate-source;
      mc mb --ignore-existing local/migrate-staging;
      mc mb --ignore-existing local/migrate-destination;
      echo 'MinIO buckets created.';
      "
    networks:
      - migrate_net

  # ── FastAPI backend ───────────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    container_name: migrate_io_api
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      LLM_PROVIDER: groq
      LLM_MODEL: llama3-70b-8192
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: migrate_io_neo4j
      STAGING_DELTA_PATH: /tmp/staging
      AWS_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
      JWT_SECRET_KEY: dev-secret-change-in-prod
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
    depends_on:
      neo4j:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ../:/app
      - staging_data:/tmp/staging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - migrate_net
    restart: unless-stopped

  # ── React frontend (Vite dev server) ─────────────────────
  frontend:
    build:
      context: ../frontend
      dockerfile: ../infra/Dockerfile.frontend
    container_name: migrate_io_frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_WS_URL: ws://localhost:8000
    volumes:
      - ../frontend:/app
      - /app/node_modules
    depends_on:
      api:
        condition: service_healthy
    networks:
      - migrate_net
    restart: unless-stopped

# ── Volumes ───────────────────────────────────────────────
volumes:
  neo4j_data:
  neo4j_logs:
  minio_data:
  staging_data:

# ── Networks ──────────────────────────────────────────────
networks:
  migrate_net:
    driver: bridge
