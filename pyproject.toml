[project]
name = "migrate-io"
version = "0.1.0"
description = "Universal Data Migration Platform — NL → Spark, Schema Graph, Delta Staging"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # Core framework
    "pydantic>=2.7",
    "structlog>=24.2",
    "python-dotenv>=1.0",

    # FastAPI
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",

    # Graph
    "neo4j>=5.20",
    "networkx>=3.3",
    "Levenshtein>=0.25",

    # Auth
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",

    # LLM — Groq (default, free tier)
    "groq>=0.9",

    # Observability
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
# Real connectors
s3 = ["boto3>=1.34", "s3fs>=2024.6"]
adls = ["azure-storage-file-datalake>=12.16", "azure-identity>=1.17"]
gcs = ["google-cloud-storage>=2.17"]
postgres = ["psycopg2-binary>=2.9"]
mysql = ["pymysql>=1.1", "mysqlclient>=2.2"]
snowflake = ["snowflake-sqlalchemy>=1.6", "snowflake-connector-python>=3.10"]
kafka = ["confluent-kafka>=2.4"]
sap = ["pyrfc>=3.3"]
databricks = ["databricks-sdk>=0.28"]

# LLM alternatives
anthropic = ["anthropic>=0.30"]
ollama = ["ollama>=0.3"]

# Neo4j
neo4j = ["neo4j>=5.20"]

# Testing
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

# All real connectors
all = [
    "migrate-io[s3,adls,gcs,postgres,mysql,kafka,neo4j,databricks]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "connectors", "graph", "intent", "dag", "compiler",
    "execution", "observability", "api", "transform",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false
